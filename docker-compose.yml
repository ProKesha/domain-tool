services:
  postgres:
    image: postgres:16-alpine
    container_name: domain-tool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: domain_tool
      POSTGRES_USER: domain_tool
      POSTGRES_PASSWORD: domain_tool_dev
    ports:
      - "5433:5432"
    volumes:
      - domain_tool_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domain_tool -d domain_tool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: domain-tool-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - domain_tool_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  domain_tool_postgres:
  domain_tool_redis:
